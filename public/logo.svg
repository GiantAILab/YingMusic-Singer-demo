<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" />
  
  <!-- Musical Note combining with a 'Y' shape and wave -->
  <g transform="translate(25, 20) scale(0.5)">
    <!-- Note Head -->
    <ellipse cx="30" cy="90" rx="15" ry="12" fill="white" transform="rotate(-20 30 90)"/>
    
    <!-- Stem -->
    <path d="M42 85 V 20" stroke="white" stroke-width="8" stroke-linecap="round" />
    
    <!-- Flag / Wave / Y-arm -->
    <path d="M42 20 C 42 20, 70 10, 80 40" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Digital/Voice Waves to the right -->
    <path d="M90 30 Q 100 40 90 50" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M100 20 Q 120 40 100 60" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>